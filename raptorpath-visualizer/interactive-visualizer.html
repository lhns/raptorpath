<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raptorpath FEC/ARQ Visualizer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --src: #4a90d9; --fec: #2ecc71; --arq: #e67e22;
  --recv: #ffffff; --decoded: #f1c40f;
  --bg: #1a1a2e; --panel: #16213e; --border: #0f3460;
  --text: #e0e0e0; --accent: #53c8f5;
  --good: #2ecc71; --bad: #e74c3c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); padding: 12px; font-size: 13px; }
.grid { display: grid; grid-template-columns: 280px 1fr;
  grid-template-rows: auto auto; gap: 10px; max-width: 1400px; margin: 0 auto; }
.panel { background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; }
.panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin-bottom: 6px; }
.controls { grid-row: 1 / 3; overflow-y: auto; max-height: 90vh; }
.chart-area { grid-column: 2; }
.bottom-row { grid-column: 2; display: grid;
  grid-template-columns: 1fr 220px; gap: 10px; }
label.slider-label { display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 1px; font-size: 12px; }
label.slider-label span.val { font-weight: bold; color: var(--accent);
  min-width: 50px; text-align: right; }
input[type="range"] { width: 100%; height: 5px; -webkit-appearance: none;
  appearance: none; background: var(--border); border-radius: 3px;
  outline: none; margin-bottom: 6px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none;
  width: 12px; height: 12px; background: var(--accent); border-radius: 50%;
  cursor: pointer; }
select { width: 100%; padding: 3px; background: var(--border); color: var(--text);
  border: 1px solid #444; border-radius: 4px; margin-bottom: 6px; font-size: 11px; }
.btn-row { display: flex; gap: 4px; margin-top: 6px; }
button { flex: 1; padding: 5px 8px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); border-radius: 4px;
  cursor: pointer; font-size: 11px; }
button:hover { background: var(--border); }
button.active { background: var(--accent); color: #000; }
.metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 6px; font-size: 11px; }
.metrics-grid dt { color: #888; } .metrics-grid dd { font-weight: bold; text-align: right; }
.derived { font-size: 11px; color: #888; margin-bottom: 6px; }
.separator { border-top: 1px solid var(--border); margin: 8px 0; }
.channel-strip-wrap { position: relative; height: 24px; margin-top: 4px; }
#channel-strip { width: 100%; height: 24px; border-radius: 4px; display: block; }
canvas { border-radius: 6px; }
.chart-wrap { position: relative; }
.chart-wrap canvas { width: 100% !important; }
.tri-svg { display: block; margin: 4px auto; }
.tri-fixed { fill: var(--text); font-size: 11px; }
.tri-computed { fill: var(--accent); font-size: 12px; font-weight: bold; }
</style>
</head>
<body>
<div class="grid">

<!-- CONTROL PANEL -->
<div class="panel controls">
  <h3>Channel</h3>
  <label class="slider-label">Loss rate <span class="val" id="v-eps">5.0%</span></label>
  <input type="range" id="sl-eps" min="0" max="0.30" step="0.001" value="0.05">
  <label class="slider-label">q (Bad to Good) <span class="val" id="v-q">0.50</span></label>
  <input type="range" id="sl-q" min="0.02" max="1.0" step="0.01" value="0.50">
  <label class="slider-label">RTT (ms) <span class="val" id="v-rtt">50</span></label>
  <input type="range" id="sl-rtt" min="1" max="500" step="1" value="50">
  <label class="slider-label">Window W <span class="val" id="v-w">50</span></label>
  <input type="range" id="sl-w" min="10" max="200" step="1" value="50">
  <div class="derived" id="derived-vals">p=0.026 | burst=2.0 | sigma2=2.8</div>

  <div class="separator"></div>
  <h3>Triangle</h3>
  <select id="tri-mode">
    <option value="delta-rho">Fix delta + rho -> r</option>
    <option value="r-rho">Fix r + rho -> delta</option>
    <option value="r-delta">Fix r + delta -> rho</option>
  </select>
  <div id="sl-r-wrap">
    <label class="slider-label">r (overhead) <span class="val" id="v-r">0.10</span></label>
    <input type="range" id="sl-r" min="0.01" max="1.0" step="0.01" value="0.10">
  </div>
  <div id="sl-delta-wrap">
    <label class="slider-label">delta (P late) <span class="val" id="v-delta">1e-3</span></label>
    <input type="range" id="sl-delta" min="-6" max="-0.3" step="0.1" value="-3">
  </div>
  <div id="sl-rho-wrap">
    <label class="slider-label">rho (reliability) <span class="val" id="v-rho">1.000</span></label>
    <input type="range" id="sl-rho" min="0.90" max="1.0" step="0.001" value="1.0">
  </div>
  <svg class="tri-svg" width="256" height="130" viewBox="0 0 256 130">
    <polygon points="128,18 16,108 240,108" fill="none" stroke="#0f3460" stroke-width="1.5"/>
    <text id="tri-r" x="128" y="13" text-anchor="middle" font-size="11" class="tri-fixed">r = 0.10</text>
    <text id="tri-delta" x="4" y="124" text-anchor="start" font-size="11" class="tri-fixed">delta = 1e-3</text>
    <text id="tri-rho" x="252" y="124" text-anchor="end" font-size="11" class="tri-fixed">rho = 1.000</text>
  </svg>

  <div class="separator"></div>
  <h3>Playback</h3>
  <div class="btn-row">
    <button id="btn-play">Play</button>
    <button id="btn-reset">Reset</button>
    <select id="sel-speed" style="flex:0.6">
      <option value="1">1x</option>
      <option value="3">3x</option>
      <option value="5" selected>5x</option>
      <option value="10">10x</option>
      <option value="25">25x</option>
    </select>
  </div>
</div>

<!-- MAIN CHART -->
<div class="panel chart-area">
  <h3>Sender Rate &amp; Receiver Progress</h3>
  <div class="chart-wrap"><canvas id="main-chart" height="360"></canvas></div>
  <div class="channel-strip-wrap"><canvas id="channel-strip" height="24"></canvas></div>
</div>

<!-- BOTTOM ROW -->
<div class="bottom-row">
  <div class="panel">
    <h3>Taper Curve: tau(t) = A * (1-q)^t</h3>
    <div style="height:130px"><canvas id="taper-chart"></canvas></div>
  </div>
  <div class="panel">
    <h3>Metrics</h3>
    <dl class="metrics-grid">
      <dt>Overhead</dt><dd id="m-overhead">0.0%</dd>
      <dt>Recovery</dt><dd id="m-recovery">100%</dd>
      <dt>r*</dt><dd id="m-rstar">0.00</dd>
      <dt>Src sent</dt><dd id="m-src">0</dd>
      <dt>FEC sent</dt><dd id="m-fec">0</dd>
      <dt>ARQ sent</dt><dd id="m-arq">0</dd>
      <dt>Lost</dt><dd id="m-lost">0</dd>
      <dt>Decoded</dt><dd id="m-decoded">0</dd>
      <dt>Retx buf</dt><dd id="m-retxbuf">0</dd>
      <dt>Tick</dt><dd id="m-tick">0</dd>
    </dl>
  </div>
</div>
</div>

const NUM_SOURCE = 2000;
const SMOOTH_WINDOW = 6;

class SimWrapper {
  constructor(params) {
    this.inner = new Simulation(params.eps, params.q, params.rttMs, params.W, params.r, params.delta, params.rho);
    this.rateHistory = [];
    this.channelStates = [];
    this.lossEvents = [];
    this.eps = params.eps;
    this.q = params.q;
    const pp = params.eps * params.q / (1 - params.eps);
    this.sigma2 = burst_variance_factor(pp, params.q);
  }
  get finished() { return this.inner.is_finished(); }
  get rStar() { return this.inner.get_r_star(); }
  get rStarAuto() { return this.inner.get_r_star_auto(); }
  get totalSrc() { return this.inner.get_total_src(); }
  get totalFec() { return this.inner.get_total_fec(); }
  get totalArq() { return this.inner.get_total_arq(); }
  get totalLost() { return this.inner.get_total_lost(); }
  get cumDecoded() { return this.inner.get_cum_decoded(); }
  get tick() { return this.inner.get_tick(); }
  retxBufSize() { return this.inner.get_retx_buf_size(); }
  step() {
    if (this.finished) return;
    this.inner.step();
    this.channelStates.push(this.inner.channel_is_good() ? "good" : "bad");
    const lost = this.inner.get_lost();
    if (lost > 0) this.lossEvents.push(this.inner.get_tick() - 1);
    const pct = 100 / this.inner.get_num_source();
    this.rateHistory.push({
      src: this.inner.get_src(), fec: this.inner.get_fec(),
      arq: this.inner.get_arq(), lost,
      cumSent: this.inner.get_cum_sent() * pct,
      cumArrived: this.inner.get_cum_arrived() * pct,
      cumDecoded: this.inner.get_cum_decoded() * pct,
    });
  }
  smoothedRate(idx) {
    const w = SMOOTH_WINDOW;
    const start = Math.max(0, idx - w + 1), end = idx + 1;
    let s=0,f=0,a=0,l=0,n=0;
    for (let i=start; i<end && i<this.rateHistory.length; i++) {
      s+=this.rateHistory[i].src; f+=this.rateHistory[i].fec;
      a+=this.rateHistory[i].arq; l+=this.rateHistory[i].lost; n++;
    }
    const h = this.rateHistory[idx];
    return n>0 ? {src:s/n, fec:f/n, arq:a/n, lost:l/n,
                  cumSent:h.cumSent, cumArrived:h.cumArrived, cumDecoded:h.cumDecoded}
               : {src:0,fec:0,arq:0,lost:0,cumSent:0,cumArrived:0,cumDecoded:0};
  }
}

    const idx = labels.length; labels.push(idx);
    const r = sim.smoothedRate(idx);
    ds[0].data.push(r.src); ds[1].data.push(r.fec); ds[2].data.push(r.arq);
    ds[3].data.push(r.lost);
    ds[4].data.push(r.cumSent); ds[5].data.push(r.cumArrived); ds[6].data.push(r.cumDecoded);
  }
  mainChart.update('none');
  drawStrip(); updateMetrics();
  if (running) animId = requestAnimationFrame(animate);
  else { document.getElementById('btn-play').textContent='Play';
         document.getElementById('btn-play').classList.remove('active'); }
}

// =========================================================================
// EVENTS
// =========================================================================
document.getElementById('btn-play').addEventListener('click', () => {
  if (!sim || sim.finished) resetSim();
  running = !running;
  const b=document.getElementById('btn-play');
  b.textContent=running?'Pause':'Play'; b.classList.toggle('active',running);
  if (running) animId = requestAnimationFrame(animate);
});
document.getElementById('btn-reset').addEventListener('click', resetSim);
triMode.addEventListener('change', () => { updateTriVis(); solveTri(); });
for (const sl of [slEps,slQ,slRtt,slW,slR,slDelta,slRho])
  sl.addEventListener('input', () => { updateLabels(); updateTaper(); solveTri(); });

updateLabels(); updateTriVis(); updateTaper(); solveTri(); resetSim();
</script>
</body>
</html>
