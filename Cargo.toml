[workspace]
members = ["raptorpath", "raptorpath-math", "raptorpath-wasm", "gf256"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1

# The profiling profile. `perf` needs symbols and line tables that
# `[profile.release]` does not emit (`debug` defaults to `false`).
#
# It must not change the code being measured, so it inherits `release` and
# adds `debug = 1` (line tables) and nothing else. In particular it does not
# set `force-frame-pointers`:
#
#   * frame pointers cost a general-purpose register on x86-64 and change
#     codegen, which would make the profiled binary a different sender from
#     the one being profiled;
#   * they are not needed, because rustc emits DWARF CFI (`.eh_frame`) into
#     release builds already — `panic = "unwind"` is the default and nothing
#     here overrides it — so `perf record --call-graph dwarf` can unwind
#     without them.
#
# `debug = 1` was meant to add only DWARF, but on this tree it changes the
# release `.text` (status §22 Amendment 5: the section hashes differ), so a
# release-prof profile is NOT a profile of the shipped binary; compare the
# `.text` hashes before attributing a profile to the release binary. Building
# with this profile is opt-in:
#
#   cargo build --profile release-prof   ->  target/release-prof/raptorpath
[profile.release-prof]
inherits = "release"
debug = 1

[profile.test]
opt-level = 2
