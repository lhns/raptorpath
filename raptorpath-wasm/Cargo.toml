[package]
name = "raptorpath-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for raptorpath math (visualizer)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
raptorpath-math = { path = "../raptorpath-math" }

[dependencies.getrandom]
version = "0.3"
features = ["wasm_js"]
