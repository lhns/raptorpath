[package]
name = "mettle"
version = "0.1.0"
edition = "2021"
description = "METTLE streaming erasure code with peeling decoder (research implementation)"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
rand_chacha = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mettle_bench"
harness = false
