- id: E04
  name: Copa max_bw / btlbw (delivery-rate max)
  area: estimator
  rank: 1
  priority: P0
  reach: default, every cell
  loc: "scheduler/copa.rs:746 record_delivery (ack-interval, the DEFAULT feeder via scheduler/path.rs:484 on_ack when no CopaFeed); copa.rs:850 rs_on_delivered (send-interval sampler) fed only from net/copa_feed.rs:172, i.e. only under RWM_COPA_FEED/passthrough; max filter copa.rs:723; gate effective_btlbw :1472 (>= 8 samples)"
  formula: "max_bw = max over the window of (delta_delivered / delta_t_ack), delta_t >= 1 ms ; window 10 s (ack-interval feeder) ; bdp_anchor = max_bw * min_rtt (copa.rs:1458)"
  paper: "§2.7 (fec-arq-model.md:400-416) documents it: the default ack-interval sampler over-reads x4.6-7.4 and the over-read is 'partly load-bearing'; the honest send-interval sampler (RWM_PLAIN_RS, removed §49) read 1.02x the link but cost c2 20 %; §6.1 symbol table"
  derivation: "the send-interval sampler is cited (BBR delivery-rate sampling) and survives only on the Copa-feed seat; §23 showed that on a store-bound sender BOTH sampler families measure the rate the cap lets through, so neither can be the store law's input alone (paper §2.7)"
  regime: "measured at c8 (p0-dwell-diag §4): 110k-240k sym/s against a 9.8k/s link (11-24x); c1 x8-29 (§23 Q1 MECHANISM-CONFIRMED at c1s and c2: ack-interval samples over bunched acks); the send-interval anchor UNDER-reads x0.1-0.5 on a store-bound sender and the shipped law on it collapses to its floor (§23 Q2)"
  clamp: "window 10 s; >= 8 samples"
  inputs: "DISHONEST and circular: the ack-interval rate measures ack bunching (§23 Q1), and any delivered-rate sampler on a store-bound sender reads the cap's own throughput (§23). The c8 11-24x is presumably the same mechanism (p0-dwell-diag §7 left it undiagnosed; not confirmed here)"
  modeswitch: "RWM_COPA_FEED selects the sampler (an experiment gate)"
  verdicts: [DISHONEST-INPUT]
  measured: "yes"
  gauge: "yes"
  fix_class: "open input design: no candidate has passed - send-interval sampler under-reads (§23), min-filtered loop time INFLATES and quinn's rate OVER-READs x7.6 (§24), bbr_rs reads the delivered rate, CIRCULAR at c2 (§27), receiver dispersion NOT-YET (§36, §40), derivation NONE-CLOSES (§34), netem-oracle L converges only at c2 (§43b)"
  depends_on: []
  ships_with: [F01, E03]
  evidence: "max_bw 11-24x the c8 link rate (p0-dwell-diag §4), x8-29 at c1 by the ack-bunching mechanism (§23 Q1); the honest send-interval sampler runs only on the Copa-feed seat (on_src_delivered_seq's one caller is copa_feed.rs:172) and under-reads a store-bound sender (§23 Q2)"

