# Law ledger, machine-readable. Rendered into law-ledger.md by law-ledger/render.py.
# Base: github/main cbe2be3f. Branch-only rows say so in `loc`.
# Required keys per row: id, name, verdicts, priority, depends_on, evidence.
# Extra keys: rank (fix order over every row; rows with fix_class "none" come last),
# area, reach, fix_class, ships_with (same change and battery; overrides the order
# that depends_on alone would suggest),
# measured (yes|partial|no), gauge (yes|partial|no|n/a), and the ten audit columns
# loc, formula, paper, derivation, regime, clamp, inputs, modeswitch.
# Verdict tags: OK, DIVERGENT, UNDERIVED, PINNED(cells), DEGENERATE(cells),
# DISHONEST-INPUT, MODE-SWITCH(live|dead). Criteria: law-ledger.md section 1.

meta:
  base: cbe2be3f
  date: 2026-11-13
  pinned_threshold: "a clamp binding >= 0.5 of the operating range at a measured cell (declared here; measurement-discipline rule 18 names no number)"
  priorities:
    P0: "the decision is wrong by a large factor on the default path at a measured cell, with a user-visible cost"
    P1: "default path; wrong or unverifiable, with a plausible material cost"
    P2: "bounded cost, or narrow reach (rho < 1, Realtime, one cell, a candidate branch)"
    P3: "opt-in arm, model only, dead code, or cosmetic"

rows:

# ---------------------------------------------------------------- estimators
- id: E01
  name: app-echo RTT EWMA (est.rtt())
  area: estimator
  rank: 7
  priority: P1
  reach: default, every cell
  loc: "control/estimator.rs:465 record_rtt, :523 rtt(); fed net/control_msg.rs:298 (Ack), :572 (WindowAck); seed 50 ms estimator.rs:281"
  formula: "ewma <- 0.125*(now - echo_send_ts) + 0.875*ewma ; first sample replaces the 50 ms seed (RWM_MSTAR_ANCHOR, on)"
  paper: "§2.6 / §3.2 call it SRTT; §11.3 row 'span deadline' notes it is used where the model says RTprop"
  derivation: "cited (RFC 6298 gain 1/8). The sample is stamped at the placement lock, before the owner channel and quinn's send buffer (net/lat.rs header), so it is RTprop + network queue + sender dwell"
  regime: "measured as a gauge (`rtt=` on [DIAG]); p0-dwell-diag §1: rtt0 - wrtt0 = quinn send-buffer dwell within 6 ms on 24/30 c8 rows (64 ms BASE, 222 ms CAND)"
  clamp: "none"
  inputs: "honest as an app-echo round trip; DISHONEST wherever a law reads it as a path RTT or RTprop (S01, S02, S06, E11, C01, C04, C05, C06, R07)"
  modeswitch: "none"
  verdicts: [DISHONEST-INPUT]
  measured: "yes"
  gauge: "yes"
  fix_class: input
  depends_on: []
  ships_with: []
  evidence: "c8: app-echo excess over the wire RTT equals quinn's p0 send-buffer dwell (64-282 ms on a 10 ms leg), p0-dwell-diag §1"

