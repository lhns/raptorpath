- id: model-three-knobs
  title: Three application knobs (lifetime T, delay price, order hold H)
  track: model
  kind: law
  state: in-progress
  outcome: unrated
  evidence:
  - docs/derivations/three-knobs.md
  verdict_quote: ''
  headline: ''
  depends_on: []
  replaced_by: []
  qualified_by: []
  lane: no-cargo
  start: '2026-11-23'
  end: ''
  folded: []
  overview: true
  plain: 'Replace the delivery share as a setting with three numbers the application states: how long data stays worth sending (lifetime, in seconds), how much each millisecond costs, and how long the receiver may hold data behind a gap. The share delivered becomes a reported result, never a promise.'
  notes: 'Owner 2026-11-23, after rejecting ADR-0084 as it stands: "i think this is actually good"; asked for a detailed draft and a build to see how it fares. Derivation on branch three-knobs (0e027fb1, registration amendment 1 at 674311a5), reviewed with Fable: L1 nothing sent at age >= T (intake included), L2 resend only while age + SRTT/2 < T with a per-seq verdict timer, L6 receiver release at min(t_detect + H, t_floor + H_f), T = inf identical to rho = 1. Order knob in seconds (owner suggested a fraction of T; fails at T = inf). Deletes the 1 - rho budget, D as a give-up age, shed_recv_hold, recv_shed_on and its exception rows. Would amend ADR-0064, ADR-0084 (dec 3, 5, 6, Am. 1-3) and CLAUDE.md (rho an independent dial): owner decision. Open questions Q1-Q11 in the derivation section 7 and 11 (Realtime T for object transfers, overload at finite T). Offline simulation stage 3 (branch toy-stage3-knobs 39efa6a3, findings in the derivation section 12): T = inf is float-identical to rho = 1 and both ends of H work; outage shares as predicted (40 % mid-stream at T = 0.4 s). The lifetime adds almost nothing to on-time delivery in these cells (the gain over today comes from the sender not giving up early); the simulation has no link capacity, so its expected benefit is untested. Positive control, crossover shift and overload cell failed or were invalid; new defect D1 (verdict timer fires on in-flight data and, with given-up seqs out of the count, releases the pause). Follow-ups to register: control at the fill age, capacity-limited cell, D1 fix. Owner 2026-11-24: "let fable make a revised design that improves these things". Revision 1 (three-knobs b502ca8e, section 13, Fable-reviewed): one ack timeout R = srtt + max(4 rttvar, g) + max ack delay (RFC 6298/9002) drives all fixes; a verdict needs the lifetime test failed AND evidence of loss after the last send (RACK time test or overdue by R); the pause releases on receiver feedback only (Q6 no, ADR-0084 decision 3 unamended); under overload the oldest unit is dropped at dequeue when a + R >= T and a younger one waits; T belongs to the hand-over kind (objects T = inf at every hint, datagrams and tunnel packets 0.4 s at Realtime); the capped sweep is replaced by a probe at last send + R (Q13, changes T = inf resend timing, its own engine change). Not fixable: delay pinned near T - R under sustained overload (Q12), the strict-order stall beyond the outage, timeout verdicts when an ack is slower than R (gauge vta); open Q14 (engine source of the newest-received send stamp). The sweep cap clamp(2 srtt, 25, 100 ms) bound 100 % in stage 3 (ledger verdict owed). Stage 3b (toy-stage3-knobs d0ce4f9d, findings in derivation section 14): D1 fixed (0 verdicts on delivered data in 1 326 runs); the new arm meets its own bands (overload 0.815 on time at any order, capacity cell 0.848); crossover follows the path under the R probe. Never-give-up baselines in the link cells invalid: the simulation brakes only fresh data, so resends storm the queue (the engine gates every send by cwnd); the lifetime''s gain is not established. Overload at strict order 0.087, same as never giving up. New defect D2: the R probe recovers an outage tail one seq per R, so T = inf (Bulk, Auto) never finishes at 50 ms; the old sweep also shifts with the path, so the probe has no remaining motivation. Next, registered first: resend brake on every arm, non-serial tail recovery at T = inf, valid pause readout. Owner 2026-11-24 approved the next step with Fable. Revision 2 (three-knobs c3616d96, section 15, Fable-reviewed): the R probe is withdrawn and the old sweep kept; verdict evidence from receiver feedback only. Diagnosis of the strict-order overload collapse: each given-up hole blocks one round trip of the tell (floor queued behind data), about 30 holes open at once, so the strict frontier never catches up. Fix: the floor becomes the lowest seq the sender still means to deliver (protected while a resend could still arrive in time), carried on every data datagram, inert at T = inf (Q15 wire form). Correction: the engine does not brake resends by cwnd; it budgets them (10 per 5 ms times a multiplier); the simulation now models that budget for every arm. Stage 3c (toy-stage3-knobs 02eda90b, derivation section 16): T = inf equals full delivery in all 12 cells and every run finishes; no queue drops; strict-order overload collapse fixed (0.801 on time against 0.087); crossover follows the path. The +65-point capacity-cell gain is the run geometry (full delivery is not on time again until near the end of the 10 s run), so recovery time after the outage is the readout to register. Failed: the floor commitment (143 copies below the floor in 28 runs, a contradiction in section 15); the feedback-only verdict never fired; smoothness control not placed a third time (use the planted STEP/KINK control). Untested: two paths (a floor on every datagram could pass slow-path data still in flight). Next, registered first: the seam fix, engine-like blocker-only sweep, recovery-time readout, planted control, floor-law ablation, two-path cell. Owner 2026-11-24: "yes Start the run"; Revision 3 (three-knobs bd64f394, section 17, Fable-reviewed): the floor law uses each seq''s real trigger delay and the one-way term srtt - RTprop/2 (queueing assumed on the data direction, Q18), with a re-check before each copy; the feedback-only verdict is deleted (it cannot fire under the floor) and survives only as the ablation S5v; an engine-like blocker-only sweep for every arm; recovery time after the outage as the capacity-cell headline (CL-long, 20 s); the planted STEP/SPIKE/KINK control routed through T; a two-path cell P2 (10 and 60 ms). K-L10b''s extra resends are a separate cause: the capped sweep resends before acks return (Q17, sweep eligibility max(P, R)). Stage 3d (toy-stage3-knobs e17b4c64, derivation section 18): one path established in simulation. Floor commitment held in all 5 628 runs. Recovery after a 1.5 s outage on the capacity-limited link: full delivery 6.7 to 7.8 s (outage x rate / headroom), any order alone saves about 1.1 s, a 0.4 s lifetime recovers within 0.1 s at the cost of 7.6 % never delivered. The floor law fixes strict order under overload (82.8 % on time against 6.8 % without it). Two paths open: at a 75 ms lifetime strict order gives 2 % on time with the measured floor hold, or 91.5 % with 6.5 % filled late without it; the late-fill risk is probably masked. Ablation liveness gap (spec error). Next: two-path cells at the call rate and with a loss-free fast path, cold-start RTT seed, repair. Reshapes model-ordering-hold, meas-disorder-price and the ADR-0084 sender build (Q9: decide before its shed step). 2026-11-24: a fine lifetime sweep near 0.4 s shows no step (the simulator''s step is its own, derivation section 19). A sampling bug in the offline simulation (RTT taken on a seq the floor passed, never arrived; 0.036 % of samples) understated CL-long at 0.4 s: 94.1 % delivered with the fix against 92.4 %; all never-give-up, 2 s and two-path arms unchanged (section 18 amendment); re-baseline running on branch toy-stage3d-rttfix. Stage 3e (repair) registered on reg-stage3e abe2981c, 684 runs, awaiting the advisor''s final review and the owner''s go.'
