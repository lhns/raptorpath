  folded: []
  overview: false
  plain: 'The owner rejected two parts of the sender-first plan: a lost packet at the end of a transfer may wait without limit once the receiver''s old early skips have used up the allowance, and the receiver waits a fixed-window delay before honouring the sender''s skip message. This derivation prices the ways to fix the first before the sender build ships, and re-derives the second without the borrowed 10 s window.'
  notes: 'Owner 2026-11-22: L-TAIL fix first (reverses or amends ADR-0084 Amendment 3''s order; recorded as a Proposed Amendment 4 once a fix is chosen); W = 10 s not confirmed. Options priced: (a) Amendment 3''s fallback now (floor-only receiver), (b) the full receiver build after the disorder measurement, (c) counting only the sender''s own give-ups against the allowance, and any simpler correct option; for the hold: whether per-path order alone suffices, else a window derived from measured quantities. Also records: the verdict age runs from the original send and D uses the smoothed EWMA RTT, so whether the age gate refuses at N = 1 depends on how far the EWMA sits above the report round trip (dead in the simulation, open in the engine); main''s D at two paths reads the highest-loss path''s EWMA RTT, not the paper''s largest RTprop (divergence, bounding test owed). The sender build and its guard wait on this node. 2026-11-22 derivation (branch tail-fix-derivation f1851c4c, Fable-reviewed, revision round open): the lost tail is extra resend rounds on a live link (about 11 ms mean, 0.2 s p99 on the 10 %-loss link; a dead link stalls the end in every design); the defect is that the receiver''s old early skip spends the sender''s allowance. Working default for the fix: option (c), the allowance counts only the holes the sender''s floor passed (one ack field riding v11, no Realtime latency change, total interim skipping up to the receiver''s own plus 1 %; the two-path D fix becomes a precondition). Working default for the hold: event rule E0, act once the skip message (or later data) has arrived on every path it was sent on, else after that path''s loss timeout; no 10 s memory; on two paths the wait stays about the delay difference. Both await the owner after the offline simulation measures (c) against the interim and the floor-only receiver, and E0 against the windowed maximum including in-path reordering. Guard registration and floor-hold.md untouched until then. Revision 3d98ec09: tail cost per cell with the sweep period (c2 0.7 ms mean / 25 ms p99; XE 11 ms / 100-200 ms); last copies about 90-630/s and floors at most 0.15-0.6 % of data bytes; the lost-tail stage can witness the refusal path without a test seam at rho = 0.9999 (power check open: pending verdicts may fill the 4-unit budget alone); E0 needs only a path count and one timeout (no path ids), timeout from the engine''s own per-path srtt and sigma. Finding: on a path that reorders packets, E0 releases about half of the skips whose last copy got through before the copy arrives; the engine then delivers the late copy at once, out of order (reorder.rs:267), so it is disorder, not loss. No guard cell reorders inside a path (every cell sets rate). Two remedies (a per-path measured lateness; the floor inside the copy) are being measured in the offline simulation beside the windowed hold and E0, so E0 is the default only for order-keeping paths until then. 2026-11-22 offline simulation stage 2, Part T (one path, Realtime, rho 0.99, one 1.5 s outage, 12 seeds): no design leaves a lost tail stuck. Today''s receiver ends inside the promise (0.99 % abandoned) with brief overshoots (worst 2-3 packets at 1-3 % loss, 41 at 10 % loss with 100 ms RTT). Option (c) abandons about 29 more packets per object (ends at 1.24 %), passing them 8 ms sooner (43 ms at 10 %/100 ms) and not resending them into the outage; its shown mean-wait gain is those packets leaving the average, not faster delivery. The floor-only receiver (a) is equivalent to today at 3 % loss and 38 ms slower on mean wait at 10 %/100 ms, never above the promise. Prediction miss: the derivation expected about one sweep round per affected packet (25/100 ms); measured 8/43 ms. Tail completion time cannot separate the designs in these cells. Two-path (c) untested. Decision (c) against (a) goes to the owner; the hold rule waits on Parts C and D. Mid-stream outage cell (reported only, toy-sim-stage2 c0f33f8e): today''s receiver ends at 1.08 % abandoned at 10 % loss / 100 ms RTT against the 1 % setting (its own skip is capped by the measured loss rate, not by 1 - rho); (c) 1.52 %; floor-only (a) 0.60 % with mean wait 597 ms against 423 ms. Owner 2026-11-23, on learning that Realtime''s rho = 0.99 is a declared default (ADR-0084 decision 6), not derived: rejects ADR-0084 as it stands and will review it. No fix is chosen; nothing built on ADR-0084 until the owner''s review.'
