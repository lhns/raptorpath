- id: model-rho-step-sites
  title: Make all twelve ρ splits continuous
  track: model
  kind: mechanism
  state: in-progress
  outcome: unrated
  evidence:
  - ADR-0084 Amendment 1
  - docs/derivations/rho-step-sites.md
  verdict_quote: ''
  headline: ''
  depends_on:
  - rec-evict-blocker-unresolved
  replaced_by: []
  qualified_by: []
  lane: no-cargo
  start: '2026-11-20'
  end: ''
  folded: []
  overview: false
  plain: 'Twelve places in the engine behave one way when no data may be dropped (ρ = 1) and another way below it. Each is checked for a reason; each split is replaced by one formula continuous in ρ that keeps today''s ρ = 1 behaviour, and the reliable flag is deleted.'
  notes: 'Owner decision 2026-11-20: option B (rewrite all twelve), not grandfathered; framing: ask whether each split has a reason, work only on behaviour we can derive. Derivation on branch rho-step-sites (docs/derivations/rho-step-sites.md), then one commit per site stacked on the ADR-0084 fix. Done when: the reader count of the derived bit is 0, the field is deleted, and the acceptance test (one seed at rho = 1, 0.9999, 0.999, 0.99; runs below 1 differ only by give-ups within (1 - rho) S) is green. 2026-11-20 derivation merged: of the twelve splits, ten have no recorded reason (rollout scope or a copied store test) and two had reasons that ADR-0084 voids (C5 store headroom, C8 store backstop). Shapes: eight keep one arm at every rho, C7 is gated by a verdict set, C2 is made valid at every rho, C6 is an owner question. No Bulk or Auto default changes; six sites change Realtime behaviour. Receiver recommendation: floor-only (no rho at the receiver). Acceptance test sim_rho_dial::rho_dial_is_one_machine. Owner answers 2026-11-21 (rho-step-sites.md par. 8): C6 = option (a), requests judged by the same per-seq verdict rule; the Realtime N >= 2 changes (C1 placement law, C3 per-flight hole law, gap-report coalescing at every N) accepted. Still open: R1 floor-only as final (sender-only R1 is the staging point only), the floor-cadence reversal, the C10 hold at Realtime, the R1 serialize cost. The Bulk/Auto line is amended: no default change from the twelve sites, but design U''s release rule, once it ships, may deliver late and out of order at Bulk after a long outage (accepted). C9/C11/C12 release arm lands once with the release rule, after omega is measured. 2026-11-21 re-cut (owner yes, ADR-0084 Amendment 3): sender sites C1-C7 and C12 refresh half ship in the ADR-0084 build; C8, C9, C10, C11 and C12 expiry ship once with design U in the release-rule build (model-ordering-hold), where the bit and the exception block are deleted and sim_rho_dial and rho1_debt_is_gone are un-ignored. The interim 1 - rho promise is not kept at Realtime: old-arm passes are counted in G_rx but not told or bounded; C10 drops are uncounted. 2026-11-21 owner (Amendment 3): Q-a accepted with its fallback (expires with the exception at the release-rule build); Q-b answered (iii), H derived first (model-floor-hold); rho-step-sites par. 8 records both.'
