  start: '2026-11-21'
  end: ''
  folded: []
  overview: false
  plain: 'How long the receiver should wait for a missing packet before delivering the ones behind it out of order, as one smooth function of the latency price. Whether Bulk and Auto keep strict order depends on a new number, the price of one out-of-order delivery, to be measured.'
  notes: 'Derivation on branch ordering-hold-derivation (paper-first, no code), revised after Fable review. Rule on the paper''s own frontier pricing (par. 7.3): release hole s when (delta/d)*(t - t_detect) reaches omega, so H_o = omega*d/delta, continuous, exactly 1/delta, no rho, no hint; rent-or-buy (Karlin et al. 1988), 2x offline optimum for isolated holes. Per-held-packet pricing carried only as an alternative (a paper extension). Hazard rule refuted. N = 1: Bulk keeps order for omega > 0.03, Auto needs omega about 3. N = 2 with skew: every slow-path packet starts a hole and is released and reordered unless omega >= delta*skew/d (Realtime always; Auto when d is small), coupled to the C1 owner decision. H proposed as a path support bound (about 0 at N = 1), reconciled in skip-rule-efficiency (F1 per H). window_out_of_order delivery half = omega 0. Owner 2026-11-21: design U chosen; omega set by measurement and followed (meas-disorder-price); at Bulk after a long outage late out-of-order delivery instead of a stall is acceptable once the release rule ships (the first Bulk default change). Not decided: adopting H_o (the release arm), the new H, retiring window_out_of_order; they wait on the toy and omega. C1''s coupling to U is read with the omega measurement. 2026-11-21 owner (ADR-0084 Amendment 3): the release-rule build carries the whole receiver side of ADR-0084: C9 and C11 release arm by H_o(delta), C10 hold, C12 expiry rewrite, C8 corners, floor-on-raise cadence, reorder tombstones, the new H (replacing shed_recv_hold, proposed UNDERIVED debt), deleting rho1_debt_bit and the exception block; un-ignore sim_rho_dial, rho1_debt_is_gone and the reverse mixed pairing. It lands once, after omega is measured. 2026-11-21 owner (Amendment 3): Q-a accepted; the release-rule build removes the exception list and its fallback clause together. Q-b answered (iii): the floor pass''s H is derived on its own first (model-floor-hold), not deferred to this build; this build''s new H for the release arm reads that derivation.'
