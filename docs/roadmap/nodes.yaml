- id: model-skip-rule-efficiency
  title: The most efficient give-up rule below ρ = 1
  track: model
  kind: law
  state: blocked
  outcome: unrated
  evidence:
  - docs/derivations/skip-rule-efficiency.md
  verdict_quote: ''
  headline: ''
  depends_on:
  - rec-evict-blocker-unresolved
  - model-rho-step-sites
  replaced_by: []
  qualified_by: []
  lane: no-cargo
  start: '2026-11-21'
  end: ''
  folded: []
  overview: false
  plain: 'Which lost packets a ρ < 1 stream should give up on, when, and on which side. Every give-up should still send one last copy; whether the receiver may stop waiting on its own depends on whether a packet that arrives after its successors counts as delivered; the owner decided it does (2026-11-21).'
  notes: 'Owner 2026-11-21: O3 = yes, design U chosen, RX not pursued (O4 moot); O2 cumulative count accepted, no run-length window, largest single-episode spend gauged; the last copy and the pair-merge rule accepted as ADR-0084 Amendment 2 (node model-adr84-amend2). Still waiting: O1; 2026-11-21 toy stage 1 (node model-toy-stage1): run-atomic spending and T_rho dropped, the sender rule stays verdict plus last copy; the release arm, H_o and the new H (omega measurement). Earlier: Derivation on branch skip-law-derivation (paper-first, no code). Awaiting owner: O3 (does a late out-of-order fill count as delivered; yes gives design U, a receiver release on its own hold with no wire field, after an H_o(delta) ordering derivation; no gives design RX, a receiver that spends a cumulative allowance sent by the sender, one wire field after v11), O2 (one outage may skip about 2 000 consecutive packets after a long clean run), O1, O4. Proposed now for ADR-0084 step 7: the last copy with every verdict (a copy-less shed is H slower than a resend) and the (next_expected, G_rx) pair-merge rule (G_rx falls on late fills). v11 stays as approved. Run-atomic spending and the time-domain T_rho (T_cut re-derived in seconds) wait for the pre-registered toy simulation (LP lower bound, H swept). H is UNDERIVED and carries every headline number. 2026-11-21 toy plan v2 (branch toy-plan-v2, §6): U is scored against its own exact offline optimum U* (a totally unimodular LP, or a DP for a pluggable rent with c_H), not against the passing-rule LP; presets Bulk, Auto and Realtime with ±2 % nudges; P3 on paired per-seed midpoint deviations, with the jumping hazard rule as a positive control that must fail; a base cell plus one-factor sweeps, 9 240 runs, about 24 h sequential; RX dropped; H§8 added to the H sweep; phi_slow swept; jitter is its own out-of-order class. Finding for ordering-hold: the engine''s d counts skew self-heals, so H_o = omega d/delta shortens where reordering is highest (the toy runs d_all and d_rep).'
