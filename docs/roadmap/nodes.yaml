  plain: 'Three faults in how the engine sets the age before a lost packet may be given up: on two paths it follows whichever path currently looks lossiest, so it jumps between the fast and slow path; before the first round-trip sample it uses a 50 ms placeholder; and it is only refreshed when new data is sent, so it freezes during the end of a transfer.'
  notes: 'Found 2026-11-22 by the tail-and-hold derivation. The paper (par. 5.6) says D uses the largest RTprop over live paths, 0 before the first sample; main reads min(b,2) times the EWMA RTT of the highest-loss path (ties to the last maximum), seeded at 50 ms, refreshed only on source sends. Bounding tests owed now: an absolute ratio bound at two paths with the fast leg lossier, d_is_zero_before_the_first_sample, and a refresh-during-tail test. The fix (largest RTprop over live paths) is a precondition of option (c) at two paths. Separately, D from the smoothed RTT rather than RTprop decides whether the age half of the verdict can refuse at all at Auto (open; model-tail-and-hold). 2026-11-22 bounding tests merged (tests only, binid unchanged, CI runs all three): d_input_is_the_lossiest_path_not_the_largest_rtprop (5/25 ms legs, fast leg lossier: engine D 5 ms against paper 25 ms, ratio 0.2), d_uses_the_seed_before_the_first_sample (D = 25 ms at Realtime where the paper says 0; rename on fix), sim test d_is_frozen_while_no_source_is_sent (D stays 13 ms while the EWMA RTT rises from 211 to 928 ms in the tail). The fix itself is not built.'
