  plain: 'Force late, out-of-order deliveries in the tunnel and measure what each one costs an inner TCP flow, so the receiver''s ordering hold has a measured price instead of a guess. Runs after VM batch 1. 2026-11-22: the measurement harness is being built on branch omega-harness (new files only, stub-run tested, no VM contact), so it is ready when the VM is free during the sender build.'
  notes: 'ordering-hold.md par. 1: per released-then-filled hole, inner goodput deficit and retransmits against a matched no-release run, per inner stack (Linux Cubic with RACK and DSACK undo; RACK off). Warning carried to the owner: modern TCP tolerates reordering, so omega may be small and Auto/Bulk would then reorder in normal operation. Owner 2026-11-21: measure omega on this test and follow its result. Pre-registered in disorder-price-registration.md (round 4): netem reorderer in rp-* namespaces, no engine code; REL - CLEAN and HOLD - CLEAN scored, omega derived; Linux stack first, 8 flows, standing queue measured through the tunnel, holds split within/beyond the standing delay; about 20 h of VM at n = 8, up to about 27 h after cuts at the n = 24 clamp, more than 20 h goes back to the owner. Size default (2026-11-21, Fable, awaiting owner confirmation): session R first (about 2.5 h, measures the tunnel queue and noise, settling the 14 h or 20 h+ case), then the Linux-defaults phase with the registered cut order capped at 20 h; anything above 20 h returns to the owner before launch; the classic stack (about 8 h) is decided with the first result. Runs after VM batch 1. Owner 2026-11-22: the three declared choices (Linux defaults, one inner byte = one wire byte, 8 flows) and the size default (session R first, Linux phase capped at 20 h, second stack deferred) confirmed. Harness on branch omega-harness (0bf6fff5, CI green); review round: score a capped session at the n reached (registration 9.3), rehearse the tunnel bring-up and R0, a netem seed reproducibility check, the interpretations as a draft amendment.'
