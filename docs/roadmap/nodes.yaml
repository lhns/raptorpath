- id: rec-evict-blocker-unresolved
  title: Lost packet neither resent nor dropped
  track: rec
  kind: defect-verdict
  state: in-progress
  outcome: unrated
  evidence:
  - status "S06 deletion review and an evicting-seat defect (2026-11-20)"
  - branch wedge-diag bc383f29
  verdict_quote: ''
  headline: ''
  depends_on:
  - model-floor-hold
  replaced_by: []
  qualified_by: []
  lane: host-cargo
  start: ''
  end: ''
  folded: []
  overview: false
  plain: When late data may be dropped (ρ below 1), a lost packet can be neither re-sent nor dropped, and the transfer then waits for the receiver to skip it; a lost final packet with nothing after it is never resolved.
  notes: 'Local runs on main (unpaced source ~5x an emulated 40 Mbit link): no source-rate bound on the evicting seat (intake pause reliable-only, net/mod.rs:2473); the NACK site clamps gaps to the 200-symbol window before the shed check (sender_phases.rs:790-805), so resend and shed act only while the blocker is inside it; the tail sweep re-targets a below-window first() (net/mod.rs:2789, :3035). Stalled-blocker case unresolved 19/30 (main-equivalent) and 15/30 (s06-delete). Owed: which site produced block E''s 1 934 sheds; whether paced VM rows show it. Fix direction (owner 2026-11-20, on Fable''s recommendation): one rule, every abandoned seq gets a verdict and the receiver is told. (1) The shed verdict is judged on the unclamped gap; the clamp bounds only what is served (identity at rho = 1). (2) Every verdict removes the seq from the sender and reaches the receiver, even when no data follows. (3) A rho-continuous source-rate bound replaces the reliable-only intake pause, keeping H + E inside 1 - rho. Eviction from the window is itself a verdict. The 1 - rho budget law (reads no rho, 0 on a cold estimator) is part of the same derivation. Derivation merged as Proposed: docs/derivations/evict-verdict-law.md (Fable: sound to send to the owner). Owner 2026-11-20: all defaults accepted (a store at every rho; delay the source under overload; protocol v11 WindowFloor in ADR-0084; Realtime rho = 0.99 declared; 1 - rho replaces min(1 - rho, R)). Next: ADR-0084 and the paper text, then the engine change with red-first tests, then the VM guard. Done when: a red-first test of the lost tail and the stalled blocker goes green, with the S4 counters as the oracle. 2026-11-20: tests/sim_shed_reach.rs liveness test (ignored, red) shows the second shape only under a forced shed budget (RWM_TEST_TS_BUDGET_FRAC=0.05): the NACK site sheds all 60 tail seqs, the transfer never completes (the frontier sample 10856 is stale: ev=frontier prints only on arrival; the receiver ack shows 12087). Sender ends clean is inferred (sheds cover the unacked range), not logged. The frontier-bound assertion has never executed: the red arm fails earlier on completion, the rho = 1 control sheds nothing. With the natural budget the sim sender only counts denials: the shed budget reads 0 for a transfer shorter than the loss estimator first report (liveness audit item 4; the sim has no source-rate bound). 2026-11-20 prechecks (docs/derivations/evict-fix-prechecks.md): (1) a below-window seq cannot be resent at rho < 1 (the window is the only copy; sent_store fills only when reliable), so the clamp is a correct serve bound but wrongly gates the verdict, and eviction must itself be the verdict; eviction never prunes retransmit_buffer, so first() stays stuck. (2) Nothing tells the receiver: no message carries the sender window start, and sheds and evictions send nothing. (3) The failure starts at the source: at rho < 1 the whole object enters the encoder in ~44 ms and the link drops ~1 100 datagrams on queue overflow; the budget is refreshed only on source emission, so it and the shed deadline (13 ms against an 844 ms RTT) freeze. Consequences for the fix: the floor message needs a repeat or ack rule; the rho-continuous source-rate bound is the only part that reduces abandonment; the 1 - rho budget must bound sheds, evictions and overflow losses and be enforced on the source rate. client_ok cannot be the rho < 1 liveness oracle (perf needs every chunk); the red-first test must assert the frontier and the ack, so sim_shed_reach''s assert_live must be rewritten. Was titled ''Evicting seat strands a stalled blocker''. 2026-11-20 paced check (tests/sim_lost_tail_paced.rs): with the source paced at 20 and 35 Mbit/s on a 40 Mbit link, 3 seeds each, zero queue drops, natural budget, the lost tail still stalls (ack stuck at k, O_strand 147); the rho = 1 control completes. So the defect needs no over-driven source: the cause is the below-window handling, and the rate bound alone does not fix it. 2026-11-21 owner (ADR-0084 Amendment 3, node model-adr84-sender-first): this engine build is the sender side, started right after S06 merges through VM batch 1, without waiting for omega: brief steps 1-8 (floor pass seat-free on both buffers, H = shed_recv_hold proposed as UNDERIVED debt) plus the sender sites C2, C5, C12 refresh half, C3, C4, C1, C7, C6 (C8 waits: corners below rho = 1 would reach the old arm). The receiver keeps its old arm below rho = 1 (C9, C10, C11 keyed on its own rho at the named exception sites) until the release-rule build. Budget assertions run in an R1 cell (sender rho < 1, receiver rho = 1); matched cells assert liveness and record the breach. Amendment 3 is Proposed: the exception (Q-a) and H (Q-b) await the owner, and the build does not merge before. Done criterion unchanged (lost tail and stalled blocker green). 2026-11-21 owner answers to ADR-0084 Amendment 3: Q-a accepted (the closed rho1-debt-exception list for the receiver sites, with its fallback; the release-rule build removes the list and the fallback clause together, so the fallback expires with the exception). Q-b answered (iii): derive H first (reviewed with Fable); the floor-pass step (brief step 8) waits on the H derivation (node model-floor-hold); options (i) shed_recv_hold as is and (ii) SRTT/2 are not adopted. Amendment 3 is Accepted. The sender build now depends on model-floor-hold for step 8 (steps 0-7 do not).'
