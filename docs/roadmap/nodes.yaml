  plain: 'A small offline simulation tested two extra sender rules for giving up on lost packets. Giving up on a whole run of missing packets at once saved budget in outages but never cut delay; a time-based give-up deadline cut one worst case but doubled repair traffic and made bursty loss worse. Both are dropped, so the accepted rule stays.'
  notes: 'Fable-reviewed. 12 seeds (registered 20), LP on 3-6 seeds in some cells, MILP on 3; the H = 5 ms, separate-floor and N=2 outage cells were added after registration and are reported only. Run-atomic: largest-episode spend falls at B10 (-191) but HOL p99 worsens beyond the CI at B10n2f/B10n2a (+0.025 ms), so DROP under the registered bar; recorded as not shown to help, its designed case (a closed run longer than the bank) was never produced. Instrument defect: with common random numbers the paired CI collapses, so later bars need a stated minimum size. T_rho: G p99 +0.37 ms, B60 unmoved; T_rho = max(D, S^-1 - L) falls with H, so it is inert for H above about 3 ms; inert at N=2 under the derived H on a one-seed 8 s check only (not a full run). Carried to the guard registration review: with the floor as its own datagram at H = 0 the floor overtakes its copy about half the time (487 transient passes per run at I1 against 65 shared). Findings carried forward: the age gate (age > D) refused nothing in any cell, N=2 included, so the next stage (skew and U) needs a cell where reports can be younger than D; the toy shared-fate floor (floor inside the copy) is an artefact, since the engine sends WindowFloor as its own datagram and repeats it, and the separate-floor model resolves isolated holes faster (I1 p99 11.5 against S0 14.4 ms), slightly slower in bursts (G 12.5 against 12.0 shared) because one floor datagram has one loss draw; the LP gap is not a distance to the optimum where the count binds. Correction 2026-11-22: the separate-floor numbers (including I1 11.5 ms and the 487 transient floor-before-copy passes) are unreliable: the simulation kept FIFO for originals only and let copies and floors draw independent jitter, so floors overtook copies on a FIFO path. No decision rests on them; plan v3 makes every path FIFO for every datagram. 2026-11-22 plan v3 review: one-path parts (A/A calibration, a new first part pricing the floor-only receiver against today''s early-skip receiver with a lost-tail cell, and part B for U at one path) to be built on branch toy-sim-stage2; D gets an EWMA-RTT arm like the engine; continuity test gets planted step, preset-override and kink controls; two-path, window and floor parts wait for model-tail-and-hold. The age-gate zero is proven only for the simulation, where D = b*RTprop exactly. The engine takes age from the original send (emit_source.rs:505) but sets D from the smoothed EWMA RTT (shed.rs:31, emit_source.rs:631), which sits above fast round trips and includes queueing, so in the engine the gate may refuse at Auto; not shown either way (corrected 2026-11-22).'
