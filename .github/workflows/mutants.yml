# S6: mutation testing of raptorpath-math and raptorpath-core. Fails only on a
# NEW survivor or a stale baseline entry (tools/ci/mutants_compare.py).
# raptorpath-math has per-platform bit-pin tables; this runs on Linux, so the
# baseline is the Linux one.
name: mutants
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  push:
    branches: [mutation-ci]   # TEMPORARY, removed before merge
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-mutants@25.3.1" }
      - run: |
          cargo mutants --list -p raptorpath-math -p raptorpath-core > mutants.list
          wc -l mutants.list | tee -a "$GITHUB_STEP_SUMMARY"
          cut -d: -f1 mutants.list | sort | uniq -c | sort -rn | tee -a "$GITHUB_STEP_SUMMARY"
