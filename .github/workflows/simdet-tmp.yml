# TEMPORARY (sim-determinism diagnosis): Linux traces for a Windows diff. Removed before merge.
name: simdet-tmp
on:
  push:
    branches: [sim-determinism-fix]
permissions:
  contents: read
jobs:
  traces:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tc: ["1.95.0", stable]
    env:
      RUSTFLAGS: "--cfg tokio_unstable"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ matrix.tc }}" }
      - uses: Swatinem/rust-cache@v2.7.8
        with: { shared-key: "sim-${{ matrix.tc }}" }
      - run: |
          BIN=$(cargo test -p raptorpath --features sim,test-seams --test sim_shed_reach --no-run --message-format=json | jq -r 'select(.target.name == "sim_shed_reach" and .executable != null) | .executable' | tail -1)
          echo "BIN=$BIN"
          rustc -V; for s in "nat30 nat30 47400" "nat30_b nat30 47400" "shed6_a shed6 47400" "shed6_b shed6 47401" "basic_a basic 47100" "basic_b basic 47101"; do
            set -- $s; bash .github/simdet-tmp/child.sh $BIN out $1 $2 $3
          done
          SIM_TRACE=quinn_proto=trace,raptorpath=trace SIM_TRACE_OUT=out/basic_t.ftrace bash .github/simdet-tmp/child.sh $BIN out basic_t basic 47100
          SIM_TRACE=quinn_proto=trace,raptorpath=trace SIM_TRACE_OUT=out/basic_t2.ftrace bash .github/simdet-tmp/child.sh $BIN out basic_t2 basic 47100
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "simdet-linux-${{ matrix.tc }}", path: out/ }
