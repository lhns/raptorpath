name: diag
on:
  push:
    branches: [ci-followups]
jobs:
  s62:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with: { python-version: "3.12" }
      - run: |
          start=$(date +%s)
          python tools/l1/test_stubrun.py > out.txt 2>&1 || true
          echo "wall $(( $(date +%s) - start )) s; FAIL lines $(grep -ac '^ *FAIL' out.txt)"
          grep -a "^ *FAIL" out.txt | cut -c1-600 | head -8; tail -4 out.txt | cut -c1-300
